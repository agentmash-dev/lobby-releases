# a lobby release, built here: this repository is public, so github's mac and windows runners cost nothing.
# the app's code is in the private agentmash-dev/lobby; the LOBBY_SOURCE_TOKEN secret reads it (a fine-grained
# token with read-only contents on that one repository).
#
#   gh workflow run release --repo agentmash-dev/lobby-releases                  the version on lobby's main
#   gh workflow run release --repo agentmash-dev/lobby-releases -f dry_run=true  builds and checks it all, publishes nothing
#
# the version is apps/desktop/package.json's on that commit: bump it in lobby first. the release gets the files the
# app updates from (src/updates.ts there): the mac zips and dmgs, the windows installer, install.sh and SHA256SUMS.
#
# in order: the ref turned into one commit that every job after checks out, lobby's typecheck and tests on it, then
# the builds, each package checked on its own os, then a prerelease, its files downloaded back and checked against
# SHA256SUMS, and only then the release everyone gets. the app, the download links and install.sh all go by
# releases/latest, which a prerelease never is, so a run that stops halfway reaches nobody. a bad release is never
# taken back: ship x.y.z+1 from the last good ref (-f ref=<tag or commit>, with apps/desktop/package.json bumped
# there), and the app updates past it within the hour.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: lobby branch, tag or commit to build
        default: main
      notes:
        description: release notes (markdown); empty takes docs/releases/<version>.md from lobby if it has one
        default: ''
      dry_run:
        description: build everything, publish nothing
        type: boolean
        default: false
      skip_checks:
        description: skip lobby's typecheck and tests (for a fix that can't wait on a check that is itself broken)
        type: boolean
        default: false

# read only, but for the one step that publishes
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # the ref to one commit, once: lobby's main can move while this runs (a merge, a version bump), and a job that
  # checked out the branch itself could build code the check never ran, or tag older binaries with a newer version.
  # no if here, so skip_checks never skips it. the sha goes in the run's summary.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(gh api "repos/agentmash-dev/lobby/commits/$REF" --jq .sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$REF is no branch, tag or commit in agentmash-dev/lobby"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "agentmash-dev/lobby \`$REF\` is $sha: the check, both builds and the release all come from it" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: resolve
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: agentmash-dev/lobby
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mac:
    needs: [resolve, check]
    # only after a check that passed, or one skipped on purpose with skip_checks. a check past its timeout ends
    # 'cancelled', not 'failure', and stops the release as a failed one does. resolve is asked for by name: when it
    # fails, check is only skipped, and with skip_checks that would build an empty ref, lobby's default branch.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.check.result == 'success' || (inputs.skip_checks && needs.check.result == 'skipped')) }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: agentmash-dev/lobby
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # both arches, ad-hoc signed (scripts/dist-mac.mjs)
      - run: npm run dist:mac
      # each package checked as windows' is: production files only, node-pty's binaries unpacked, electron's fuses
      - run: node --conditions=source --import tsx scripts/dist-check.mjs --package --app apps/desktop/release/mac-arm64/agentmash-lobby.app
      - run: node --conditions=source --import tsx scripts/dist-check.mjs --package --app apps/desktop/release/mac/agentmash-lobby.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          if-no-files-found: error
          path: |
            apps/desktop/release/agentmash-lobby-mac-arm64.zip
            apps/desktop/release/agentmash-lobby-mac-arm64.dmg
            apps/desktop/release/agentmash-lobby-mac-x64.zip
            apps/desktop/release/agentmash-lobby-mac-x64.dmg

  windows:
    needs: [resolve, check]
    # as mac's
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.check.result == 'success' || (inputs.skip_checks && needs.check.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: agentmash-dev/lobby
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      # the package checked the way lobby's ci does it
      - run: node --conditions=source --import tsx scripts/dist-check.mjs --package --app apps/desktop/release/win-unpacked/agentmash-lobby.exe
      # the name the app updates from, whatever the version
      - shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          mv "apps/desktop/release/agentmash-lobby-$version-setup.exe" apps/desktop/release/agentmash-lobby-win-x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          if-no-files-found: error
          path: apps/desktop/release/agentmash-lobby-win-x64-setup.exe

  publish:
    # resolve for its sha: the version, install-mac.sh and the notes come from the commit the binaries were built from
    needs: [resolve, mac, windows]
    if: ${{ !cancelled() && needs.mac.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: agentmash-dev/lobby
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: sums and notes
        env:
          NOTES: ${{ inputs.notes }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          echo "v$version is agentmash-dev/lobby@$SHA" >> "$GITHUB_STEP_SUMMARY"
          cp scripts/install-mac.sh dist/install.sh
          (cd dist && sha256sum agentmash-lobby-* install.sh > SHA256SUMS && cat SHA256SUMS)
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.md
          elif [ -f "docs/releases/$version.md" ]; then cp "docs/releases/$version.md" notes.md
          else echo "agentmash lobby $version" > notes.md; fi
          ls -la dist
      # a prerelease first: nothing goes by it (releases/latest skips it) until its files are checked below
      - name: publish as a prerelease
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released: bump apps/desktop/package.json in lobby first"
            exit 1
          fi
          gh release create "v$version" dist/* --repo "$GITHUB_REPOSITORY" --title "agentmash lobby $version" --notes-file notes.md --prerelease
      # what github serves is what was built and checked: every file downloaded back, against SHA256SUMS
      - name: check the files as published
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS)
          cmp published/SHA256SUMS dist/SHA256SUMS
          [ "$(ls published | wc -l)" = "$(ls dist | wc -l)" ] || { echo "::error::the release has other files than were built"; exit 1; }
      - name: release it to everyone
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
      # the agentmash community's patch notes chat on telegram, when the bot's secrets are here (agentmash's
      # RUNBOOK.md, "patch notes on telegram"). A post that doesn't go never fails the release.
      - name: tell the patch notes chat
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          # each as pasted, less spaces anywhere and quotes around it; a chat written as telegram's web app
          # shows a topic, -100…_<topic>, is the chat and then the topic
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed -E "s/^([\"'])(.*)\\1\$/\\2/"; }
          token=$(clean "$TELEGRAM_BOT_TOKEN")
          chat=$(clean "$TELEGRAM_CHAT_ID")
          thread=$(clean "$TELEGRAM_THREAD_ID")
          if [[ $chat =~ ^(-?[0-9]+)_([0-9]+)$ ]]; then
            chat=${BASH_REMATCH[1]}
            thread=${thread:-${BASH_REMATCH[2]}}
          fi
          if [ -z "$token" ] || [ -z "$chat" ]; then
            echo "no TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets: nothing sent"
            exit 0
          fi
          notes=$(cat notes.md)
          # the notes that only say the version add nothing under a heading that says it
          [ "$notes" != "agentmash lobby $version" ] || notes=""
          {
            printf 'agentmash lobby %s is out\n\n' "$version"
            [ -z "$notes" ] || printf '%s\n\n' "$notes"
            printf 'the app updates itself within the hour. new here: https://github.com/%s/releases/tag/v%s\n' "$GITHUB_REPOSITORY" "$version"
          } > post.txt
          args=(--data-urlencode "chat_id=$chat" --data-urlencode "text@post.txt" --data-urlencode 'link_preview_options={"is_disabled":true}')
          [ -z "$thread" ] || args+=(--data-urlencode "message_thread_id=$thread")
          curl -fsS --max-time 15 -o /dev/null "https://api.telegram.org/bot$token/sendMessage" "${args[@]}"
          echo "sent to the patch notes chat"
