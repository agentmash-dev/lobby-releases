# a lobby release, built here: this repository is public, so github's mac and windows runners cost nothing.
# the app's code is in the private agentmash-dev/lobby; the LOBBY_SOURCE_TOKEN secret reads it (a fine-grained
# token with read-only contents on that one repository).
#
#   gh workflow run release --repo agentmash-dev/lobby-releases                  the version on lobby's main
#   gh workflow run release --repo agentmash-dev/lobby-releases -f dry_run=true  builds it all, publishes nothing
#
# the version is apps/desktop/package.json's on that commit: bump it in lobby first. the release gets the files the
# app updates from (src/updates.ts there): the mac zips and dmgs, the windows installer, install.sh and SHA256SUMS.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: lobby branch, tag or commit to build
        default: main
      notes:
        description: release notes (markdown); empty takes docs/releases/<version>.md from lobby if it has one
        default: ''
      dry_run:
        description: build everything, publish nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: agentmash-dev/lobby
          ref: ${{ inputs.ref }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # both arches, ad-hoc signed (scripts/dist-mac.mjs)
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            apps/desktop/release/agentmash-lobby-mac-arm64.zip
            apps/desktop/release/agentmash-lobby-mac-arm64.dmg
            apps/desktop/release/agentmash-lobby-mac-x64.zip
            apps/desktop/release/agentmash-lobby-mac-x64.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: agentmash-dev/lobby
          ref: ${{ inputs.ref }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      # the package checked the way lobby's ci does it
      - run: node --conditions=source --import tsx scripts/dist-check.mjs --package --app apps/desktop/release/win-unpacked/agentmash-lobby.exe
      # the name the app updates from, whatever the version
      - shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          mv "apps/desktop/release/agentmash-lobby-$version-setup.exe" apps/desktop/release/agentmash-lobby-win-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: apps/desktop/release/agentmash-lobby-win-x64-setup.exe

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: agentmash-dev/lobby
          ref: ${{ inputs.ref }}
          token: ${{ secrets.LOBBY_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: sums and notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          cp scripts/install-mac.sh dist/install.sh
          (cd dist && sha256sum agentmash-lobby-* install.sh > SHA256SUMS && cat SHA256SUMS)
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.md
          elif [ -f "docs/releases/$version.md" ]; then cp "docs/releases/$version.md" notes.md
          else echo "agentmash lobby $version" > notes.md; fi
          ls -la dist
      - name: publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released: bump apps/desktop/package.json in lobby first"
            exit 1
          fi
          gh release create "v$version" dist/* --repo "$GITHUB_REPOSITORY" --title "agentmash lobby $version" --notes-file notes.md --latest
      # the agentmash community's patch notes chat on telegram, when the bot's secrets are here (agentmash's
      # RUNBOOK.md, "patch notes on telegram"). A post that doesn't go never fails the release.
      - name: tell the patch notes chat
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          # each as pasted, less spaces anywhere and quotes around it; a chat written as telegram's web app
          # shows a topic, -100…_<topic>, is the chat and then the topic
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed -E "s/^([\"'])(.*)\\1\$/\\2/"; }
          token=$(clean "$TELEGRAM_BOT_TOKEN")
          chat=$(clean "$TELEGRAM_CHAT_ID")
          thread=$(clean "$TELEGRAM_THREAD_ID")
          if [[ $chat =~ ^(-?[0-9]+)_([0-9]+)$ ]]; then
            chat=${BASH_REMATCH[1]}
            thread=${thread:-${BASH_REMATCH[2]}}
          fi
          if [ -z "$token" ] || [ -z "$chat" ]; then
            echo "no TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets: nothing sent"
            exit 0
          fi
          notes=$(cat notes.md)
          # the notes that only say the version add nothing under a heading that says it
          [ "$notes" != "agentmash lobby $version" ] || notes=""
          {
            printf 'agentmash lobby %s is out\n\n' "$version"
            [ -z "$notes" ] || printf '%s\n\n' "$notes"
            printf 'the app updates itself within the hour. new here: https://github.com/%s/releases/tag/v%s\n' "$GITHUB_REPOSITORY" "$version"
          } > post.txt
          args=(--data-urlencode "chat_id=$chat" --data-urlencode "text@post.txt" --data-urlencode 'link_preview_options={"is_disabled":true}')
          [ -z "$thread" ] || args+=(--data-urlencode "message_thread_id=$thread")
          curl -fsS --max-time 15 -o /dev/null "https://api.telegram.org/bot$token/sendMessage" "${args[@]}"
          echo "sent to the patch notes chat"
